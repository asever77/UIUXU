<!doctype html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>UIUXU</title>
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
	<link rel="stylesheet" href="../assets/css/app.css" />

</head>

<body>
	<div class="area-base" data-layout="base">
		<header class="base-header"></header>
		<div class="base-body">
			<aside class="base-aside"></aside>
			<main class="base-main">
				<wrap data-dir="col">
					<group data-dir="col">
						<h1 data-heading="display" data-text="Roulette Event">Roulette Event</h1>

						<stit>Roulette Event</stit>
						<box>
							<select id="test"></select>
							<button type="button" id="reset">리셋</button>
							<div data-roulette="main">
								<div data-roulette="arrow"></div>
								<button type="button" data-roulette="start"></button>
								<div data-roulette="wrap">
									<div data-roulette="group"></div>
								</div>
							</div>
							<!-- <button type="button" onclick="UI.exe.luckyRouletteEvent.reset([1000, 2000, 3000, 4000, 5000])">리셋</button> -->
						</box>
					</group>

				</wrap>

			</main>
		</div>
		<footer class="base-footer"></footer>
	</div>

	<!-- zIndex 100: dropdown -->
	<div class="area-dropdown" data-area="body"></div>
	<!-- zIndex 200: tooltip  -->
	<div class="area-tooltip"></div>
	<!-- zIndex 300: modal -->
	<div class="area-dialog" data-area="body"></div>

	<!-- script -->
	<script type="module">
		import { UX } from "../assets/js/uiuxu.common.js";

		// 1. 공통 엔진 초기화 (LNB/헤더/푸터 및 data-ui="accordion" 자동 작동)
		UX.init().then(() => {
			// 2. [Example 2 예시] 세팅이 필요한 경우 수동 생성
			const datas = [1000, 2000, 3000, 4000, 5000, 1000, 2000, 3000, 4000, 5000];
			const datas2 = [1000, 2000, 3000, 4000, 5000];
			let current = 1000;
			UI.exe.luckyRouletteEvent = new UX.Roulette({
				id: 'main',
				speed: 5000,
				turns: 5,

				data: datas,
				start: (v) => {
					UI.exe.luckyRouletteEvent.play({
						result: current,
						callback: (v) => {
							console.log(v);
						}
					});
				}
			});

			datas.forEach(item => {
				document.querySelector('#test').insertAdjacentHTML('beforeend', `<option value="${item}">${item}</option>`);
			});
			document.querySelector('#test').addEventListener('change', (e) => {
				current = Number(e.currentTarget.value);
			});
			document.querySelector('#reset').addEventListener('click', (e) => {
				UI.exe.luckyRouletteEvent.reset(datas2);
			})
		});
	</script>
</body>

</html>
