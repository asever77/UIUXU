<!doctype html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>UIUXU</title>
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
	<link rel="stylesheet" href="../assets/css/app.css" />
	<style>
		[data-scrollevent-item] b {
			position: sticky;
			top: 0
		}

		;
	</style>

</head>

<body>
	<div class="area-base" data-layout="base">
		<header class="base-header"></header>
		<div class="base-body">
			<aside class="base-aside"></aside>
			<main class="base-main">
				<wrap data-dir="col">
					<group data-dir="col">
						<h1 data-heading="display" data-text="Scroll Event">Scroll Event</h1>

						<box>

							<div data-scrollevent="main">
								<div data-scrollevent-item="a1"
									style="font-size: 10rem; display: flex; align-items: flex-start; justify-content: center; color:#fff; font-weight: 700; width: 100%; height: 100dvh; background-color: var(--gray-90);">
									a1: <b>0</b>
								</div>
								<div data-scrollevent-item="a2"
									style="font-size: 10rem; display: flex; align-items: flex-start; justify-content: center; color:#fff; font-weight: 700; width: 100%; height: 100dvh; background-color: var(--gray-80);">
									a2: <b>0</b>
								</div>
								<div data-scrollevent-item="a3"
									style="font-size: 10rem; display: flex; align-items: flex-start; justify-content: center; color:#fff; font-weight: 700; width: 100%; height: 200dvh; background-color: var(--gray-70);">
									a3: <b>0</b>
								</div>
								<div data-scrollevent-item="a4"
									style="font-size: 10rem; display: flex; align-items: flex-start; justify-content: center; color:#fff; font-weight: 700; width: 100%; height: 100dvh; background-color: var(--gray-60);">
									a4: <b>0</b>
								</div>
								<div data-scrollevent-item="a5"
									style="font-size: 10rem; display: flex; align-items: flex-start; justify-content: center; color:#fff; font-weight: 700; width: 100%; height: 100dvh; background-color: var(--gray-50);">
									a5: <b>0</b>
								</div>
								<div data-scrollevent-item="a6"
									style="font-size: 10rem; display: flex; align-items: flex-start; justify-content: center; color:#fff; font-weight: 700; width: 100%; height: 100dvh; background-color: var(--gray-40);">
									a6: <b>0</b>
								</div>
								<div data-scrollevent-item="a7"
									style="font-size: 10rem; display: flex; align-items: flex-start; justify-content: center; color:#fff; font-weight: 700; width: 100%; height: 100dvh; background-color: var(--gray-30);">
									a7: <b>0</b>
								</div>
								<div data-scrollevent-item="a8"
									style="font-size: 10rem; display: flex; align-items: flex-start; justify-content: center; color:#fff; font-weight: 700; width: 100%; height: 100dvh; background-color: var(--gray-20);">
									a8: <b>0</b>
								</div>
							</div>
						</box>
					</group>
				</wrap>

			</main>
		</div>
		<footer class="base-footer"></footer>
	</div>

	<!-- zIndex 100: dropdown -->
	<div class="area-dropdown" data-area="body"></div>
	<!-- zIndex 200: tooltip  -->
	<div class="area-tooltip"></div>
	<!-- zIndex 300: modal -->
	<div class="area-dialog" data-area="body"></div>

	<!-- script -->
	<script type="module">
		import { UX } from "../assets/js/uiuxu.common.js";

		// 1. 공통 엔진 초기화 (LNB/헤더/푸터 및 data-ui="accordion" 자동 작동)
		UX.init().then(() => {
			// 2. [Example 2 예시] 세팅이 필요한 경우 수동 생성
			const mainpage = new UX.ScrollEvent({
				id: 'main',
				area: window,
				rootMargin: '0px 0px 0px 0px',
				threshold: [0],
				callback: (result) => {
					const per = result.percent;
					const item = result.target;
				}
			});
			mainpage.init();

		});
	</script>
</body>

</html>
